<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dayspring School — Free Christian Early Education</title>
<style>
  :root{
    --cream:#FDF6E9; --sand:#F3E7CF; --ink:#3A2E22; --soft:#6B5D4D;
    --leaf:#5F7A54; --leaf-d:#48603F; --sun:#D9A441; --sun-soft:#F0D9A8;
    --card:#FFFDF7; --line:#E5D6B8;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --serif:ui-serif,Georgia,"Palatino Linotype",serif;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:var(--sans);padding-bottom:90px;}
  header{background:linear-gradient(160deg,#48603F,#5F7A54);color:#FFFDF7;padding:26px 20px 20px;text-align:center;}
  header h1{font-family:var(--serif);font-size:24px;margin:0 0 4px;}
  header p{font-size:12.5px;margin:0;opacity:0.9;}
  .wrap{max-width:640px;margin:0 auto;padding:16px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:12px;}
  h2{font-family:var(--serif);font-size:19px;margin:4px 0 10px;}
  h3{font-size:14px;margin:14px 0 6px;color:var(--leaf-d);}
  p,li{font-size:14px;line-height:1.65;}
  ol,ul{padding-left:20px;margin:8px 0;}
  .verse{background:var(--sand);border-left:4px solid var(--sun);border-radius:0 12px 12px 0;padding:10px 14px;font-family:var(--serif);font-style:italic;}
  .verse small{display:block;font-family:var(--sans);font-style:normal;color:var(--soft);margin-top:4px;}
  nav{position:fixed;left:0;right:0;bottom:0;background:#FFFDF7;border-top:1px solid var(--line);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:10;}
  nav button{flex:1;background:none;border:none;color:var(--soft);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-family:var(--sans);}
  nav button.on{color:var(--leaf-d);font-weight:700;}
  nav button span{font-size:19px;}
  .btn{background:var(--leaf);color:#fff;border:none;border-radius:10px;padding:10px 16px;font-size:13.5px;font-weight:700;font-family:var(--sans);}
  .btn2{background:none;border:1.5px solid var(--leaf);color:var(--leaf-d);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:700;font-family:var(--sans);}
  .grp{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0;}
  .grp button{border:1.5px solid var(--line);background:#fff;color:var(--soft);border-radius:20px;padding:6px 12px;font-size:12px;font-family:var(--sans);}
  .grp button.on{background:var(--leaf);border-color:var(--leaf);color:#fff;font-weight:700;}
  input[type=text],textarea,select{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;font-family:var(--sans);background:#fff;color:var(--ink);}
  textarea{min-height:64px;resize:vertical;}
  label{font-size:11px;letter-spacing:0.06em;text-transform:uppercase;color:var(--soft);display:block;margin:12px 0 6px;font-weight:700;}
  .row{display:flex;gap:8px;}
  .row input{flex:1;}
  .kid{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px;}
  .kid:first-child{border-top:none;margin-top:0;padding-top:0;}
  .kid b{font-size:15px;}
  .tag{display:inline-block;background:var(--sun-soft);color:#7A5A17;font-size:11px;font-weight:700;border-radius:12px;padding:2px 10px;margin:4px 0;}
  .show{border-left:4px solid var(--leaf);background:#fff;border-radius:0 10px 10px 0;padding:8px 12px;margin:8px 0;font-size:13.5px;}
  .show small{color:var(--soft);}
  .hide-print{}
  @media print{
    nav,.hide-print,header{display:none !important;}
    body{padding:0;background:#fff;}
    .wrap{max-width:100%;}
    .card{border:1px solid #999;break-inside:avoid;}
  }
</style>
</head>
<body>
<header><h1>☀ Dayspring School</h1><p>A free model for Christian early education — Nursery to Primary 5</p></header>
<div class="wrap" id="app"></div>
<nav id="nav"></nav>

<script>
var SCRIPTURES = [
  {t:"Let your light so shine before men, that they may see your good works.", r:"Matthew 5:16 — we learn so we can shine."},
  {t:"Thy word is a lamp unto my feet, and a light unto my path.", r:"Psalm 119:105 — reading opens God's word to us."},
  {t:"And be not conformed to this world: but be ye transformed.", r:"Romans 12:2 — saying no to self, yes to Christ."},
  {t:"A soft answer turneth away wrath.", r:"Proverbs 15:1 — we practice gentle speech."},
  {t:"Whatsoever ye do, do it heartily, as to the Lord.", r:"Colossians 3:23 — even small handiwork is for Him."},
  {t:"If any man will come after me, let him deny himself, and take up his cross daily.", r:"Luke 9:23 — daily, not once."},
  {t:"My sheep hear my voice, and I know them, and they follow me.", r:"John 10:27 — listening is the first lesson."}
];
var GROUPS = ["Growing in Reading","Growing in Writing","Growing in Speaking"];
var TABS = [
  {id:"home", e:"☀", l:"Home"},{id:"journey", e:"🌱", l:"Journey"},
  {id:"lesson", e:"📖", l:"Lesson"},{id:"kids", e:"👧🏾", l:"Children"},
  {id:"show", e:"🧺", l:"Showcase"},{id:"guide", e:"🤝", l:"Guide"}
];
var LESSON = {
  skill:"Core skill — Reading: blend three-letter sounds (c-a-t says cat). Each child reads five words aloud, no rushing, no ranking.",
  vocation:"Vocation — Sweeping & sorting: sweep the classroom in pairs, then sort bottle caps by colour. Hands learn diligence.",
  reflect:"Reflection — Christ washed His disciples' feet. The greatest work today is serving someone quietly."
};

function load(k,f){ try{ var v = localStorage.getItem(k); return v ? JSON.parse(v) : f; }catch(e){ return f; } }
function save(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
var tab = "home";
var kids = load("ds_kids", []);
var showcase = load("ds_show", []);

function todayVerse(){
  var now = new Date(), start = new Date(now.getFullYear(),0,0);
  var day = Math.floor((now - start) / 86400000);
  return SCRIPTURES[day % SCRIPTURES.length];
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }

function render(){
  var nav = document.getElementById("nav"); nav.innerHTML = "";
  TABS.forEach(function(t){
    var b = document.createElement("button");
    b.className = t.id===tab ? "on" : "";
    b.innerHTML = "<span>"+t.e+"</span>"+t.l;
    b.onclick = function(){ tab = t.id; render(); window.scrollTo(0,0); };
    nav.appendChild(b);
  });
  var a = document.getElementById("app");
  if(tab==="home") a.innerHTML = vHome();
  else if(tab==="journey") a.innerHTML = vJourney();
  else if(tab==="lesson") a.innerHTML = vLesson();
  else if(tab==="kids") a.innerHTML = vKids();
  else if(tab==="show") a.innerHTML = vShow();
  else a.innerHTML = vGuide();
}
function vHome(){
  var v = todayVerse();
  var h = "<div class='card'><h2>Vision</h2><p>A free, pressure-free model from Nursery to Primary 5, built on one goal: every child learns to read, write, and communicate — because once they can, they can know Christ for themselves. No child is ranked, segregated, or labeled.</p></div>";
  h += "<div class='card'><h2>Today's Scripture</h2><div class='verse'>“"+esc(v.t)+"”<small>"+esc(v.r)+"</small></div></div>";
  h += "<div class='card'><h2>Core Principles</h2><ol><li><b>Free</b> — no fees, no payment, ever.</li><li><b>No grade hierarchy</b> — one continuous journey.</li><li><b>Flexible ability grouping</b> — children move as they grow.</li><li><b>Core foundation, kept simple</b> — reading, writing, communication.</li><li><b>Vocation from the start</b> — hands-on skills alongside the core.</li><li><b>One goal, equal for all.</b></li><li><b>Christ and denial of flesh</b> — woven through daily learning.</li></ol></div>";
  return h;
}
function vJourney(){
  return "<div class='card'><h2>Sample Child Journey</h2>"
    + "<p><b>Adaeze</b> joined able to speak confidently but not yet blend letter sounds.</p>"
    + "<p>She began in <span class='tag'>Growing in Speaking</span>, and as her listening grew she started sitting with the reading circle too — now she moves freely between <span class='tag'>Growing in Speaking</span> and <span class='tag'>Growing in Reading</span>.</p>"
    + "<p>No label followed her. Her group describes what she is <i>practicing now</i>, not what she <i>is</i>.</p></div>";
}
function vLesson(){
  var v = todayVerse();
  return "<div class='card' id='lessonCard'><h2>Sample Daily Lesson</h2>"
    + "<h3>1 · Core skill</h3><p>"+esc(LESSON.skill)+"</p>"
    + "<h3>2 · Vocational activity</h3><p>"+esc(LESSON.vocation)+"</p>"
    + "<h3>3 · Reflection on Christ</h3><p>"+esc(LESSON.reflect)+"</p>"
    + "<h3>Scripture of the day</h3><div class='verse'>“"+esc(v.t)+"”<small>"+esc(v.r)+"</small></div>"
    + "<p class='hide-print' style='margin-top:14px'><button class='btn' onclick='window.print()'>🖨 Print this lesson</button></p></div>";
}
function vKids(){
  var h = "<div class='card'><h2>Ability-Group Tracker</h2><p style='color:var(--soft);font-size:13px'>Groups describe what a child is practicing now — never a rank or label. Saved in this browser only.</p>";
  h += "<div class='row'><input type='text' id='newKid' placeholder='Child\u2019s name' maxlength='40'><button class='btn' onclick='addKid()'>Add</button></div>";
  if(!kids.length) h += "<p style='color:var(--soft)'>No children added yet.</p>";
  kids.forEach(function(k,i){
    h += "<div class='kid'><b>"+esc(k.name)+"</b> <span class='tag'>"+esc(k.group)+"</span><div class='grp'>";
    GROUPS.forEach(function(g){
      h += "<button class='"+(g===k.group?"on":"")+"' onclick='moveKid("+i+",\""+g+"\")'>"+g.replace("Growing in ","")+"</button>";
    });
    h += "</div><label>Progress note (no scores)</label><textarea oninput='noteKid("+i+",this.value)' placeholder='e.g. Blended her first three words today.'>"+esc(k.note||"")+"</textarea>";
    h += "<p><button class='btn2' onclick='delKid("+i+")'>Remove</button></p></div>";
  });
  return h + "</div>";
}
function vShow(){
  var h = "<div class='card'><h2>Skills Showcase</h2><p style='color:var(--soft);font-size:13px'>Short descriptions of hands-on work children practiced.</p>";
  h += "<label>Child's name (optional)</label><input type='text' id='swWho' placeholder='e.g. Adaeze' maxlength='40'>";
  h += "<label>What did they practice?</label><textarea id='swWhat' placeholder='e.g. Swept the classroom and sorted caps by colour.'></textarea>";
  h += "<p><button class='btn' onclick='addShow()'>Add to showcase</button></p>";
  if(!showcase.length) h += "<p style='color:var(--soft)'>Nothing showcased yet.</p>";
  showcase.forEach(function(s,i){
    h += "<div class='show'>"+esc(s.what)+"<br><small>"+esc(s.who||"A Dayspring child")+" · "+esc(s.day)+" · <a href='#' onclick='delShow("+i+");return false'>remove</a></small></div>";
  });
  return h + "</div>";
}
function vGuide(){
  return "<div class='card'><h2>How to Group a Child</h2>"
    + "<p>Grouping answers one question only: <b>what is this child ready to practice next?</b></p>"
    + "<ol><li><b>Watch, don't test.</b> Listen as they read, write, and speak in normal activity.</li>"
    + "<li><b>Describe the practice, not the child.</b> Say “growing in reading,” never “slow” or “weak.”</li>"
    + "<li><b>One group at a time is fine — two is fine too.</b> A child may speak fluently while still growing in writing.</li>"
    + "<li><b>Move freely.</b> Review weekly; move a child the moment they are ready. No ceremony, no announcement.</li>"
    + "<li><b>Never rank groups.</b> Reading is not above speaking. All groups walk the same road.</li>"
    + "<li><b>Notes, not scores.</b> Write what you saw (“read five words aloud”), not a number.</li></ol></div>";
}
window.addKid = function(){
  var el = document.getElementById("newKid"), n = el.value.trim();
  if(!n) return;
  kids.push({name:n, group:GROUPS[0], note:""}); save("ds_kids", kids); render();
};
window.moveKid = function(i,g){ kids[i].group = g; save("ds_kids", kids); render(); };
window.noteKid = function(i,v){ kids[i].note = v; save("ds_kids", kids); };
window.delKid = function(i){ kids.splice(i,1); save("ds_kids", kids); render(); };
window.addShow = function(){
  var w = document.getElementById("swWhat").value.trim(); if(!w) return;
  var who = document.getElementById("swWho").value.trim();
  showcase.unshift({who:who, what:w, day:new Date().toISOString().slice(0,10)});
  save("ds_show", showcase); render();
};
window.delShow = function(i){ showcase.splice(i,1); save("ds_show", showcase); render(); };
render();
</script>
</body>
</html>
